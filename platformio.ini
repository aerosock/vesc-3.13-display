; PlatformIO Project Configuration for Waveshare ESP32-S3-LCD-3.16
; Target: ESP32-S3R8 (16MB Flash, 8MB Octal PSRAM) + ST7701 820x320 RGB Panel
; eBike Dashboard for Flipsky 75100 V1 Basic VESC Controller

[env:waveshare-esp32-s3-lcd-316]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino

; Serial monitor and upload
monitor_speed = 115200
upload_speed = 921600

; Memory & Flash Configuration (16MB Flash QIO, 8MB Octal PSRAM OPI)
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

; Compiler and Preprocessor Flags
build_flags = 
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -O3

; Library Dependencies
lib_deps =
    lovyan03/LovyanGFX@^1.1.16
